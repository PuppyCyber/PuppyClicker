  async function decrypt(content, password) {
  const encoder = new TextEncoder();
  const encodedPassword = encoder.encode(password);
  const additionalData = encoder.encode('https://github.com/ardislu/static-encrypt');

  const contentBuffer = Uint8Array.fromBase64(content);
  const salt = new Uint8Array(32);
  const iv = new Uint8Array(12);
  const ciphertext = new Uint8Array(contentBuffer.byteLength - salt.byteLength - iv.byteLength);
  salt.set(contentBuffer.slice(0, salt.byteLength));
  iv.set(contentBuffer.slice(salt.byteLength, salt.byteLength + iv.byteLength));
  ciphertext.set(contentBuffer.slice(salt.byteLength + iv.byteLength));

  const keyMaterial = await crypto.subtle.importKey(
    'raw',
    encodedPassword,
    'PBKDF2',
    false,
    ['deriveKey']
  );

  const key = await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      hash: 'SHA-512',
      salt,
      iterations: 400_000
    },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  const encodedPlaintext = new Uint8Array(await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv, additionalData },
    key,
    ciphertext
  ));

  const plaintext = new TextDecoder().decode(encodedPlaintext);

  return plaintext;
}</script>

    document.querySelector('form').addEventListener('submit', async e => {

      const password = new FormData(e.target).get('password');

        for (let i = 1; i < content.length; i++) {

            try {
            key = await decrypt(content[i],password);
            const newDocument = await decrypt(content[0], key);
            document.open();
            document.write(newDocument);
            document.close();
            return;
        } catch {}
      }
      input.setCustomValidity('Incorrect password.');
      input.reportValidity();
    });

    input.addEventListener('input', e => e.target.setCustomValidity(''));
